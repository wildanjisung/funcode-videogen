[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen-mvp0"
version = "0.1.0"
description = "Internal desktop tool for generating burned-in subtitles from video."
requires-python = ">=3.11,<3.14"
dependencies = [
  "faster-whisper>=1.1,<2",
  "av>=11,<19",
  "PySide6-Essentials==6.8.2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psutil>=6,<8"]

[project.scripts]
videogen = "videogen.presentation.desktop:main"
videogen-web = "videogen.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videogen = ["presentation/resources/*", "web/static/*"]
